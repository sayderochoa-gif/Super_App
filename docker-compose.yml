services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Database (Multi-schema: raw, staging, curated)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: sismowatch-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sismowatch}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_master_pass}
    ports:
      - "${HOST_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sismowatch"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sismowatch-net

  # ---------------------------------------------------------------------------
  # 2. Airflow Database Migration & User Initializer
  # ---------------------------------------------------------------------------
  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: sismowatch-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate && \
        airflow users create \
          --username ${AIRFLOW_USERNAME:-airflow} \
          --firstname SismoWatch \
          --lastname Admin \
          --role Admin \
          --email airflow@sismowatch.com \
          --password ${AIRFLOW_PASSWORD:-airflow} || true
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_master_pass}@postgres:5432/${POSTGRES_DB:-sismowatch}
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      PYTHONPATH: /opt/airflow/plugins
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sismowatch-net

  # ---------------------------------------------------------------------------
  # 3. Airflow Scheduler
  # ---------------------------------------------------------------------------
  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: sismowatch-airflow-scheduler
    restart: always
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_master_pass}@postgres:5432/${POSTGRES_DB:-sismowatch}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_master_pass}@postgres:5432/${POSTGRES_DB:-sismowatch}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sismowatch}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_master_pass}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PYTHONPATH: /opt/airflow/plugins
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - sismowatch-net

  # ---------------------------------------------------------------------------
  # 4. Airflow Webserver
  # ---------------------------------------------------------------------------
  airflow-webserver:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: sismowatch-airflow-webserver
    restart: always
    command: webserver
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_master_pass}@postgres:5432/${POSTGRES_DB:-sismowatch}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_master_pass}@postgres:5432/${POSTGRES_DB:-sismowatch}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sismowatch}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_master_pass}
      PYTHONPATH: /opt/airflow/plugins
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - sismowatch-net

  # ---------------------------------------------------------------------------
  # 5. Backend REST & SSE API (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sismowatch-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sismowatch}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_master_pass}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-sismowatch-super-secret-jwt-key-2025-production-grade}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ADMIN_USER: ${ADMIN_USER:-admin@sismowatch.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminSismoWatch2025!}
      VIEWER_USER: ${VIEWER_USER:-viewer@sismowatch.com}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:-ViewerSismoWatch2025!}
      AIRFLOW_BASE_URL: http://airflow-webserver:8080
      AIRFLOW_USERNAME: ${AIRFLOW_USERNAME:-airflow}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-airflow}
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost,http://127.0.0.1:5173"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sismowatch-net

  # ---------------------------------------------------------------------------
  # 6. Frontend SPA (React + Vite + Leaflet + Tailwind)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sismowatch-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - sismowatch-net

networks:
  sismowatch-net:
    driver: bridge

volumes:
  postgres_data:
